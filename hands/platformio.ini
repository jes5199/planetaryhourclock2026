; Planetary hour clock: hand drive firmware
; Board: Waveshare Servo Driver with ESP32 (ESP32-D0WD-V3, 4 MB flash, CP2102 USB serial)
; Servos: 2x Feetech STS3215 (12 V version) on the board's serial bus servo port
;
;   pio run -t upload --upload-port /dev/cu.usbserial-0001
;   pio device monitor -p /dev/cu.usbserial-0001

[platformio]
default_envs = servodriver

[env:servodriver]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Fast uploads came back corrupted on this board's CP2102; 115200 is slow but reliable.
upload_speed = 115200
