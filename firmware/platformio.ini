; Planetary hour clock firmware
; Board: Waveshare ESP32-S3-Touch-AMOLED-1.43 (ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM)
;
;   pio run -e amoled143 -t upload     build and flash
;   pio device monitor                 serial log
;   pio test -e native                 host tests for the time maths

[platformio]
default_envs = amoled143

[env:amoled143]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
lib_deps =
  lvgl/lvgl@8.3.11

; Design preview: forces the ruling planet so its colours can be checked.
;   pio run -e preview -t upload
; Edit PREVIEW_RULER below: Saturn=0 Jupiter=1 Mars=2 Sun=3 Venus=4 Mercury=5 Moon=6
[env:preview]
extends = env:amoled143
build_flags =
  ${env:amoled143.build_flags}
  -DPREVIEW_RULER=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
lib_compat_mode = off
lib_ignore = amoled
